<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aurora WDC · Workbench</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><h1>Aurora WDC<small>Workbench</small></h1><nav id="nav" hidden aria-label="Sections"></nav></header>
<section id="lock" hidden><h2>Sign in</h2><p class="lede">Plan the work, review the agent, publish changes.</p>

<p id="err" class="err" role="alert"></p></section>
<main id="app" hidden></main>
<script src="core.js"></script>
<script src="manage.js"></script>
<script src="feedback.js"></script>
